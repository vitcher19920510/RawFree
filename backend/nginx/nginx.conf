events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Логирование в формате JSON
    log_format json_analytics escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time"}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name rawfree.ru www.rawfree.ru;

        # Челлендж Let's Encrypt Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name rawfree.ru www.rawfree.ru;

        ssl_certificate     /etc/letsencrypt/live/rawfree.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rawfree.ru/privkey.pem;

        # Роутинг на API бэкенд NestJS
        location /api/ {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Проверка состояния Healthcheck
        location /health {
            proxy_pass http://api:3000/health;
            proxy_set_header Host $host;
        }

        # ===================================================================
        # Включить в Блоке 10 вместе с сервисом admin
        # ===================================================================
        # location /admin/ {
        #     proxy_pass http://admin:3001/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }
    }
}
