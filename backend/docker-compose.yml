  #   ports:
  #     - "3001:3001"
  #   environment:
  #     DATABASE_URL: "postgresql://${POSTGRES_USER:-rawfree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rawfree_db}?schema=public"
  #   depends_on:
  #     - postgres

volumes:
  pgdata:
  redisdata:




